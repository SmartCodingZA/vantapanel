# Fresh-install smoke test.
#
# Guards against the failure class where a published release cannot perform a
# new install (e.g. an update-only package with no bin/install.sh reaching
# customers, which broke every fresh install from v5.39 until it was caught).
#
# Two layers:
#   1. bootstrap-verify — the exact customer one-liner in VP_BOOTSTRAP_ONLY
#      mode: manifest reachable, package downloads, sha256 matches, Ed25519
#      release signature valid, bundle contains bin/install.sh.
#   2. full-install — a complete real install on a fresh Ubuntu 24.04 systemd
#      container, then probes /vwhm and /vpanel over HTTPS.
#
# Runs daily, on any installer change, and on demand. A scheduled failure
# automatically opens (or updates) a GitHub issue so breakage is never silent.

name: install-smoke

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'install/**'
      - '.github/workflows/install-smoke.yml'

permissions:
  contents: read
  issues: write

jobs:
  bootstrap-verify:
    name: Bootstrap verify (live customer path)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run the one-liner in verify-only mode
        run: |
          set -o pipefail
          curl -fsSL https://get.vantapanel.com | sudo VP_BOOTSTRAP_ONLY=1 bash

  full-install:
    name: Full install on fresh Ubuntu 24.04
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Start a fresh systemd container
        run: |
          docker run -d --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --name vp jrei/systemd-ubuntu:24.04
          # wait for systemd to reach a usable state
          for i in $(seq 1 30); do
            docker exec vp systemctl is-system-running 2>/dev/null | grep -qE 'running|degraded' && break
            sleep 2
          done
          docker exec vp systemctl is-system-running || true

      - name: Run the real install
        run: |
          # Docker images ship a policy-rc.d that blocks services from starting
          # during apt installs; a real VPS has no such file. Remove it so the
          # container behaves like the fresh server a customer actually has.
          docker exec vp rm -f /usr/sbin/policy-rc.d
          docker exec vp bash -c 'export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null'
          docker exec vp bash -c 'curl -fsSL https://get.vantapanel.com | bash'

      - name: Verify panel services and endpoints
        run: |
          docker exec vp systemctl is-active vantapanel-whm.service
          docker exec vp systemctl is-active vantapanel-user.service
          for path in /vwhm /vpanel; do
            code=$(docker exec vp curl -ksLo /dev/null -w '%{http_code}' "https://localhost${path}")
            echo "GET ${path} -> HTTP ${code}"
            case "$code" in
              200|401) ;;   # a served page is a pass; 000/404/5xx is not
              *) echo "unexpected response for ${path}"; exit 1 ;;
            esac
          done

      - name: Collect logs on failure
        if: failure()
        run: |
          docker exec vp journalctl -u vantapanel-whm --no-pager -n 100 || true
          docker exec vp journalctl -u vantapanel-user --no-pager -n 100 || true
          docker exec vp systemctl --failed --no-pager || true

  alert:
    name: Open issue on scheduled failure
    runs-on: ubuntu-latest
    needs: [bootstrap-verify, full-install]
    if: failure() && github.event_name == 'schedule'
    steps:
      - name: File or update tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Fresh install is broken (install-smoke failing)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', creator: 'github-actions[bot]'
            });
            const existing = issues.find(i => i.title === title);
            const body = `The daily fresh-install smoke test failed: ${runUrl}\n\n` +
              'A new customer running `curl -fsSL https://get.vantapanel.com | sudo bash` ' +
              'is likely unable to install right now. Check whether the published package ' +
              'is a full bundle (contains `bin/install.sh`) and that the signed manifest ' +
              'points at it.';
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: `Still failing: ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body
              });
            }
